
services:
  api:
    build: .
    container_name: fintech_api
    env_file: .env
    environment:
      - DB_HOST=db # Nombre del servicio dentro de la red de compose
      - DB_PORT=1521
      - DB_SERVICE_NAME=XEPDB1
      - FRONTEND_URL=${FRONTEND_URL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # Wait for db service to be healthy
    volumes:
      - .:/src
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # Solo desarrollo; la imagen base corre sin --reload


  db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: oracle_db
    env_file: .env
    ports:
      - "1522:1521"
    volumes:
      - fintech_data:/opt/oracle/oradata
    restart: unless-stopped
    healthcheck: # Healthcheck nativo de la imagen Oracle XE (más estable que sqlplus bajo Docker Desktop)
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh >/dev/null || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 20
      start_period: 300s

volumes:
  fintech_data: