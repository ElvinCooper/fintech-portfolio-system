[tool.ruff]
# Excluir directorios comunes
exclude = [
    ".git",
    ".github",
    ".idea",
    ".vscode",
    "venv",
    "__pycache__",
    "alembic/versions",
]

line-length = 120 # Aumentado para evitar errores de longitud en docstrings
target-version = "py312"

[tool.ruff.lint]
# Habilitar reglas recomendadas
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "B008", # Ignorar Depends() en argumentos de FastAPI
    "F821", # Ignorar nombres no definidos en modelos (SQLModel maneja referencias circulares)
    "B905", # Ignorar zip(strict=True) para Python < 3.10 compatible (aunque usamos 3.12)
    "E402", # Ignorar imports no al principio (útil para scripts de seed)
    "UP006", # Ignorar conversión de List a list (causa problemas en mappers de SQLModel)
    "UP035", # Ignorar advertencias de deprecación de typing.List
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
